[package]
name = "rvgen"
version = "0.1.0"
edition = "2021"
description = "A standalone RISC-V instruction and test program generator"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rand = "=0.8.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8.23"

[dev-dependencies]
object = { version = "0.36.7", default-features = false, features = ["read", "elf", "std"] }
